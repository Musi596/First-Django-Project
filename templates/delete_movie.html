{% extends "base.html" %}
{% block title %}Tamosho TJ - Удаление фильма{% endblock %}
{% block content %}
<h1>Удаление фильма</h1>
<p>Вы уверены, что хотите удалить фильм «{{ movie.name }}»?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'get_all_movies' %}">Отмена</a>
</form>
{% endblock %}
