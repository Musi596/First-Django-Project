{% extends "base.html" %}
{% block title %}Tamosho TJ - Изменить фильм{% endblock %}
{% block content %}
<h1>Изменить фильм</h1>
<form method="post" enctype="multipart/form-data" class="movie_form">
    {% csrf_token %}
    <label>Название фильма <input type="text" name="name" value="{{ movie.name }}" required maxlength="200" placeholder="Название"></label>
    <label>Описание фильма <textarea name="description" required placeholder="Описание">{{ movie.description }}</textarea></label>
    <label>Жанр
        <select name="genre_id" required>
            {% for genre in genres %}
            <option value="{{ genre.id }}" {% if genre.id == movie.genre_id %}selected{% endif %}>{{ genre.name }}</option>
            {% endfor %}
        </select>
    </label>
    {% if movie.image %}<p>Текущий постер:</p><img src="{{ movie.image.url }}" alt="{{ movie.name }}" style="max-width: 180px">{% endif %}
    <label>Заменить постер <input type="file" name="image" accept="image/*"></label>
    <button class="button" type="submit">Сохранить изменения</button>
</form>
{% endblock %}
